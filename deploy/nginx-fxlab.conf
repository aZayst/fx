# nginx site for fxlab.alicepage.com  ->  install as /etc/nginx/conf.d/fxlab.conf
# (or sites-available + symlink, matching however the other sites on this box are set up).
#
# SAFE BY DESIGN - this file adds ONE new `server` block and nothing else:
#   * no `http {}`-level directives (no `map`, `upstream`, `limit_req_zone`, ...), so it
#     cannot clash with definitions that already exist in the main config;
#   * `server_name` is specific and there is NO `default_server`, so traffic for the
#     other sites is untouched;
#   * it only proxies to 127.0.0.1:8100, where the fxlab container listens.
#
# Install procedure (a human does this ONCE; the CD pipeline never touches nginx):
#   1. sudo cp nginx-fxlab.conf /etc/nginx/conf.d/fxlab.conf
#   2. sudo nginx -t                  <- MUST say "syntax is ok" / "test is successful"
#   3. sudo systemctl reload nginx    <- reload (graceful), never restart
#   If step 2 fails: `sudo rm /etc/nginx/conf.d/fxlab.conf` and nothing has changed.
#
# HTTPS: look at how the existing sites get their certificates and do the same. If they
# use certbot:  sudo certbot --nginx -d fxlab.alicepage.com  (it edits only this block).

server {
    listen 80;
    listen [::]:80;
    server_name fxlab.alicepage.com;

    access_log /var/log/nginx/fxlab.access.log;
    error_log  /var/log/nginx/fxlab.error.log;

    # Prometheus metrics: only from the server itself (e.g. a local Prometheus / curl).
    location = /metrics {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:8100;
    }

    # WebSocket. The upgrade headers are written literally (instead of the usual
    # `map $http_upgrade $connection_upgrade`) precisely to avoid an http-level directive.
    location /ws {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;   # keep idle sockets open; ticks arrive every second anyway
    }

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
