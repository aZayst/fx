# nginx site for fxlab.alicepage.com
#
# Install (on the box the other sites use sites-available + a symlink in sites-enabled):
#   sudo cp nginx-fxlab.conf /etc/nginx/sites-available/fxlab.alicepage.com.conf
#   sudo ln -s /etc/nginx/sites-available/fxlab.alicepage.com.conf /etc/nginx/sites-enabled/
#   sudo nginx -t                  <- MUST say "test is successful"
#   sudo systemctl reload nginx    <- reload (graceful), never restart
#   If nginx -t fails: sudo rm /etc/nginx/sites-enabled/fxlab.alicepage.com.conf  -> unchanged.
#
# SAFE BY DESIGN - this file adds ONE new `server` block and nothing else:
#   * no http-level directives (`map`, `upstream`, ...). The shared config on this box already
#     defines `$connection_upgrade` in conf.d/websocket.conf; redefining it would FAIL nginx -t,
#     so the WebSocket upgrade headers below are written literally instead;
#   * a specific `server_name` and NO `default_server`, so other sites' traffic is untouched;
#   * it only proxies to 127.0.0.1:8100, where the fxlab systemd service listens.
#
# HTTPS: the box's other sites use `certbot --nginx`. That needs port 80 reachable from the
# internet (Let's Encrypt HTTP-01); check the firewall (`ufw status`) before running:
#   sudo certbot --nginx -d fxlab.alicepage.com     (edits only this server block)

server {
    listen 80;
    listen [::]:80;
    server_name fxlab.alicepage.com;

    access_log /var/log/nginx/fxlab.access.log;
    error_log  /var/log/nginx/fxlab.error.log;

    # Prometheus metrics: only from the server itself (e.g. a local Prometheus / curl).
    location = /metrics {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:8100;
    }

    # WebSocket. The upgrade headers are written literally (instead of the usual
    # `map $http_upgrade $connection_upgrade`) precisely to avoid an http-level directive.
    location /ws {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;   # keep idle sockets open; ticks arrive every second anyway
    }

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
