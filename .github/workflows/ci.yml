name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: lint, types, tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy fxlab
      - run: pytest --cov=fxlab --cov-report=term-missing --cov-fail-under=85

  test-postgres:
    name: tests on Postgres (what production uses)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fxlab
          POSTGRES_PASSWORD: fxlab
          POSTGRES_DB: fxlab_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fxlab -d fxlab_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://fxlab:fxlab@localhost:5432/fxlab_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: pytest

  docker:
    name: image builds and starts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t fxlab:ci .
      - name: Smoke test the container
        run: |
          docker run -d --name fxlab-ci -p 8000:8000 -e DATABASE_URL=sqlite:////tmp/ci.db fxlab:ci
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8000/ready && exit 0
            sleep 1
          done
          docker logs fxlab-ci
          exit 1
