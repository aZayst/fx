name: Deploy

# Production is a plain Linux box (no Docker): a venv per release + systemd, behind the existing nginx.
#   Release:   git tag v0.1.0 && git push origin v0.1.0
#   Roll back: Actions -> Deploy -> Run workflow -> ref = an older tag (its build is kept on the
#              server, so this only flips a symlink and restarts; no rebuild).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or commit to deploy (an older tag = rollback)"
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false   # never interrupt a deploy half-way

jobs:
  verify:
    name: verify the exact commit being deployed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check . && ruff format --check .
      - run: mypy fxlab
      - run: pytest

  deploy:
    name: deploy to fxlab.alicepage.com
    needs: [verify]
    runs-on: ubuntu-latest
    environment: production   # add "required reviewers" to this environment for a manual approval gate
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Release id = commit sha (immutable)
        run: echo "RELEASE_ID=$(git rev-parse --short=8 HEAD)" >> "$GITHUB_ENV"
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}   # pinned host key, no trust-on-first-use
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Ship the source and activate it
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
        run: |
          # deploy-native.sh builds a venv next to the live release, switches a symlink,
          # restarts only the two fxlab services, and rolls back on a failed health check.
          git archive --format=tar.gz HEAD | ssh -i ~/.ssh/id_deploy "$TARGET" \
            "sudo -n /opt/fxlab/bin/deploy-native.sh $RELEASE_ID"
      - name: Verify from the outside
        # Only once DNS + port 80/443 + TLS are in place: set the repo variable PUBLIC_URL
        # (e.g. https://fxlab.alicepage.com). Until then the on-server /ready check is the gate.
        if: ${{ vars.PUBLIC_URL != '' }}
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: |
          for i in $(seq 1 10); do
            curl -fsS "$PUBLIC_URL/health" && exit 0
            sleep 3
          done
          echo "public health check failed - see deploy/nginx-fxlab.conf and docs/sdlc-and-deploy.md"
          exit 1
