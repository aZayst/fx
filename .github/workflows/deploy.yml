name: Deploy

# Releases:  git tag v0.1.0 && git push origin v0.1.0
# Rollback / redeploy an older version: Actions -> Deploy -> Run workflow -> give the tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to deploy (e.g. v0.1.0). The image must already exist in GHCR."
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false   # never interrupt a deploy half-way

env:
  DEPLOY_DIR: /opt/fxlab

jobs:
  build:
    name: build and push image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"   # GHCR needs lowercase
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}

  deploy:
    name: deploy to fxlab.alicepage.com
    needs: [build]
    # Run after a successful build, or straight away for a manual redeploy/rollback.
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: production   # add "required reviewers" to this environment for a manual approval gate
    steps:
      - uses: actions/checkout@v4
      - name: Resolve and validate tag
        env:
          BUILT_TAG: ${{ needs.build.outputs.tag }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${BUILT_TAG:-$INPUT_TAG}"
          [[ "$TAG" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "invalid tag: $TAG"; exit 1; }
          echo "TAG=$TAG" >> "$GITHUB_ENV"
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}   # pinned host key, no trust-on-first-use
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Copy deploy files
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
        run: scp -i ~/.ssh/id_deploy deploy/compose.prod.yml deploy/deploy.sh "$TARGET:${DEPLOY_DIR}/"
      - name: Deploy
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          # The token goes over stdin so it never appears in a process list or the logs.
          printf '%s' "$REGISTRY_TOKEN" | ssh -i ~/.ssh/id_deploy "$TARGET" \
            "docker login ghcr.io -u '$REGISTRY_USER' --password-stdin && cd ${DEPLOY_DIR} && ./deploy.sh '${TAG}'"
      - name: Verify from the outside
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL || 'https://fxlab.alicepage.com' }}
        run: |
          for i in $(seq 1 10); do
            curl -fsS "$PUBLIC_URL/health" && exit 0
            sleep 3
          done
          echo "public health check failed - is the nginx site installed / TLS set up? see deploy/nginx-fxlab.conf"
          exit 1
